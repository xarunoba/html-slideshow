<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Slideshow</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>

  <main class="deck" id="deck" role="region" aria-label="Slideshow" tabindex="0">
  </main>

  <div class="progress" id="progress" aria-hidden="true"><span id="progress-bar"></span></div>

  <div class="controls" id="controls" role="group" aria-label="Slide controls">
    <button id="prev" type="button" aria-label="Previous slide"><svg viewBox="0 0 16 16" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8 10 12.5"/></svg></button>
    <div class="dots" id="dots" role="tablist" aria-label="Go to slide"></div>
    <span class="counter" id="counter" aria-live="polite">1 / 1</span>
    <button id="next" type="button" aria-label="Next slide"><svg viewBox="0 0 16 16" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
    <span class="spacer" aria-hidden="true"></span>
    <button id="fs"   type="button" aria-label="Toggle fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 16 16" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
    <button id="ov"   type="button" aria-label="Toggle overview" title="Overview (O)"><svg viewBox="0 0 16 16" width="1em" height="1em" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="4.5" height="4.5" rx="1"/><rect x="9.5" y="2" width="4.5" height="4.5" rx="1"/><rect x="2" y="9.5" width="4.5" height="4.5" rx="1"/><rect x="9.5" y="9.5" width="4.5" height="4.5" rx="1"/></svg></button>
  </div>

  <p class="hint" id="hint" hidden>&larr; &rarr; to navigate &middot; <b>F</b> fullscreen &middot; <b>O</b> overview</p>

  <script src="base.js" defer></script>
</body>
</html>
